# The data robot, on GitHub's servers (free for this use), not on your PC. No AI or paid service is used.
# Needs two repository secrets (Settings → Secrets and variables → Actions): SUPABASE_URL, SUPABASE_SECRET_KEY.
#   every day:    check the watched program pages and update what changed
#   every Sunday: search universities not searched yet for their program pages
name: Data robot

on:
  schedule:
    - cron: "30 1 * * *" # daily, 07:30 Bangladesh time
    - cron: "0 20 * * 6" # Sunday 02:00 Bangladesh time
  workflow_dispatch:
    inputs:
      task:
        description: "check or discover"
        default: "check"
      limit:
        description: "Pages to check / universities to search"
        default: "300"

concurrency:
  group: data-robot
  cancel-in-progress: false

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check program pages
        if: github.event.schedule == '30 1 * * *' || (github.event_name == 'workflow_dispatch' && inputs.task == 'check')
        run: npm run robot -- check --limit ${{ inputs.limit || '300' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}
      - name: Discover program pages
        if: github.event.schedule == '0 20 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.task == 'discover')
        run: npm run robot -- discover-all --limit ${{ inputs.limit || '40' }} --parallel 12
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}
