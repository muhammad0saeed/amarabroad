# The data robot, on GitHub's servers, not on your PC. No AI or paid service is used.
# Needs two repository secrets (Settings → Secrets and variables → Actions): SUPABASE_URL, SUPABASE_SECRET_KEY.
#
# It works non-stop: a new shift starts every 6 hours and each job works for about 5½ hours.
#   check     6 jobs × 50 websites at once  visit due program pages and update what changed
#                                           (hot pages every 6 h, normal daily, quiet every 2 days; see robot/schedule.ts)
#   discover  4 jobs × 40 universities      search universities for program pages: new ones first (best ranked first),
#                                           then each again every 30 days; adds the next 500 by rank when few are left
#
# Full speed is free only while the repository is PUBLIC. While it is private, GitHub gives 2,000 minutes
# a month, so the "plan" job switches to a small version (a few minutes per shift) that fits inside that.
name: Data robot

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # every 6 hours (06:00, 12:00, 18:00, 00:00 Bangladesh time)
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check_shards: ${{ steps.size.outputs.check_shards }}
      discover_shards: ${{ steps.size.outputs.discover_shards }}
      check_minutes: ${{ steps.size.outputs.check_minutes }}
      discover_minutes: ${{ steps.size.outputs.discover_minutes }}
      uni_minutes: ${{ steps.size.outputs.uni_minutes }}
    steps:
      - id: size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api repos/${{ github.repository }} --jq .private)" = "false" ]; then
            echo "Public repository: full speed"
            echo 'check_shards=[0,1,2,3,4,5]' >> "$GITHUB_OUTPUT"
            echo 'discover_shards=[0,1,2,3]' >> "$GITHUB_OUTPUT"
            echo 'check_minutes=330' >> "$GITHUB_OUTPUT"
            echo 'discover_minutes=300' >> "$GITHUB_OUTPUT"
            echo 'uni_minutes=40' >> "$GITHUB_OUTPUT"
          else
            echo "Private repository: small version to stay inside the free minutes. Make the repository public for full speed."
            echo 'check_shards=[0]' >> "$GITHUB_OUTPUT"
            echo 'discover_shards=[0]' >> "$GITHUB_OUTPUT"
            echo 'check_minutes=6' >> "$GITHUB_OUTPUT"
            echo 'discover_minutes=3' >> "$GITHUB_OUTPUT"
            echo 'uni_minutes=4' >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.check_shards) }}
    concurrency:
      group: robot-check-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check program pages
        run: npm run robot -- check --parallel 50 --minutes ${{ needs.plan.outputs.check_minutes }} --shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}

  discover:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.discover_shards) }}
    concurrency:
      group: robot-discover-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add more universities when few are left to search
        if: matrix.shard == 0
        run: npm run robot -- grow --step 500 --when-below 500
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Discover program pages
        run: npm run robot -- discover-all --limit 100000 --parallel 40 --minutes ${{ needs.plan.outputs.discover_minutes }} --uni-minutes ${{ needs.plan.outputs.uni_minutes }} --shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}
