# The data robot, on GitHub's servers, not on your PC. No AI or paid service is used.
# Needs two repository secrets (Settings → Secrets and variables → Actions): SUPABASE_URL, SUPABASE_SECRET_KEY.
#
# It works non-stop: a new shift starts every 6 hours and each job works for about 5½ hours.
#   check     6 jobs × 25 websites at once  visit due program pages and update what changed
#                                           (deadline within 45 days every 12 h, changed daily, normal every 3 days, quiet weekly; robot/schedule.ts)
#   discover  4 jobs × 25 universities      search universities for program pages: new ones first (best ranked first),
#                                           then each again every 30 days; adds the next 500 by rank when few are left
#   info      2 jobs: the gap-filler, universities' general pages (fees, deadlines, English, documents),
#                                           then the cross-checker (program pages vs those general pages)
#   deadlines 2 jobs × 15 websites: programs with no upcoming deadline re-read with the latest rules, best ranked first;
#                                           university-wide deadlines (strict filter) as labelled fallbacks for programs whose page states none
#   rates     every shift: exchange rates to taka for every currency (free public-domain dataset)
#   extras    every shift: scholarship rounds (official pages), news links (official and education-news feeds;
#                                           expired and dead links removed), tidying the change log
#   official  weekly (Monday 03:30 Bangladesh time): programs from official government course lists. Australia
#                                           (CRICOS): every matched university. US (College Scorecard): universities whose
#                                           websites block the robot (all of them would overfill the free database).
#                                           The UK list is downloaded by a person; see robot/README.md.
#
# Parallelism halved on 11 Nov: the free Supabase plan overloaded (database API down for an hour) at 300 websites at once.
# Full speed is free only while the repository is PUBLIC. While it is private, GitHub gives 2,000 minutes
# a month, so the "plan" job switches to a small version that fits inside that: a few minutes of page checks per
# shift and no discovery (a rushed search would mark universities as searched after only a shallow look).
name: Data robot

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # every 6 hours (06:00, 12:00, 18:00, 00:00 Bangladesh time)
    - cron: "30 21 * * 0" # official course lists, weekly (Monday 03:30 Bangladesh time)
  workflow_dispatch:
    inputs:
      official:
        description: "Only import the official course lists (Australia, US)"
        type: boolean
        default: false

# More memory than Node's default for the robot (the runners have 16 GB): one huge website shouldn't stop a job.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  plan:
    if: github.event.schedule != '30 21 * * 0' && inputs.official != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.size.outputs.full }}
      check_shards: ${{ steps.size.outputs.check_shards }}
      discover_shards: ${{ steps.size.outputs.discover_shards }}
      check_minutes: ${{ steps.size.outputs.check_minutes }}
      discover_minutes: ${{ steps.size.outputs.discover_minutes }}
      uni_minutes: ${{ steps.size.outputs.uni_minutes }}
    steps:
      - id: size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api repos/${{ github.repository }} --jq .private)" = "false" ]; then
            echo "Public repository: full speed"
            echo 'full=true' >> "$GITHUB_OUTPUT"
            echo 'check_shards=[0,1,2,3,4,5]' >> "$GITHUB_OUTPUT"
            echo 'discover_shards=[0,1,2,3]' >> "$GITHUB_OUTPUT"
            echo 'check_minutes=330' >> "$GITHUB_OUTPUT"
            echo 'discover_minutes=300' >> "$GITHUB_OUTPUT"
            echo 'uni_minutes=40' >> "$GITHUB_OUTPUT"
          else
            echo "Private repository: small version (page checks only) to stay inside the free minutes. Make the repository public for full speed and discovery."
            echo 'full=false' >> "$GITHUB_OUTPUT"
            echo 'check_shards=[0]' >> "$GITHUB_OUTPUT"
            echo 'discover_shards=[0]' >> "$GITHUB_OUTPUT"
            echo 'check_minutes=6' >> "$GITHUB_OUTPUT"
            echo 'discover_minutes=3' >> "$GITHUB_OUTPUT"
            echo 'uni_minutes=4' >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.check_shards) }}
    concurrency:
      group: robot-check-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Staggered start (check jobs start 40 s apart): 14 jobs opening at once overloaded the database on 10 Nov.
      - run: sleep $(( ${{ matrix.shard }} * 40 ))
      - name: Exchange rates to taka (once per shift)
        if: matrix.shard == 0
        continue-on-error: true
        run: npm run robot -- rates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}
      - name: Check program pages
        run: npm run robot -- check --parallel 25 --minutes ${{ needs.plan.outputs.check_minutes }} --shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}

  # Deadlines first: programs with no upcoming deadline are read again with the latest rules, best-ranked
  # universities first, each page once per rules version (robot/deadlines.ts). Ends early when none are left.
  deadlines:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    concurrency:
      group: robot-deadlines-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Staggered start (deadline jobs start 20+ min into the shift): 14 jobs opening at once overloaded the database on 10 Nov.
      - run: sleep $(( 1200 + ${{ matrix.shard }} * 120 ))
      - name: University-wide deadlines as labelled fallbacks (strict filter)
        if: matrix.shard == 0
        continue-on-error: true
        run: npm run robot -- uni-deadlines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Re-read programs that have no deadline
        run: npm run robot -- deadlines --parallel 15 --minutes 300 --shard ${{ matrix.shard }}/2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}

  discover:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.discover_shards) }}
    concurrency:
      group: robot-discover-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Staggered start (discovery starts 2-5 min in): 14 jobs opening at once overloaded the database on 10 Nov.
      - run: sleep $(( 120 + ${{ matrix.shard }} * 60 ))
      - name: Add more universities when few are left to search
        if: matrix.shard == 0
        run: npm run robot -- grow --step 500 --when-below 500
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Discover program pages
        run: npm run robot -- discover-all --limit 100000 --parallel 25 --minutes ${{ needs.plan.outputs.discover_minutes }} --uni-minutes ${{ needs.plan.outputs.uni_minutes }} --shard ${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}

  # The gap-filler: universities' general pages (fees, deadlines, English scores, documents), each
  # university again every 30 days. Only at full speed (public repository).
  info:
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    concurrency:
      group: robot-info-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Staggered start (gap-filler starts 10-12 min in): 14 jobs opening at once overloaded the database on 10 Nov.
      - run: sleep $(( 600 + ${{ matrix.shard }} * 120 ))
      - name: Read universities' general pages
        run: npm run robot -- uni-info --limit 2000 --parallel 15 --minutes 108 --shard ${{ matrix.shard }}/2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}
      - name: Cross-check program pages against universities' general pages
        if: matrix.shard == 0
        run: npm run robot -- crosscheck
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  # Small jobs, every shift: scholarship rounds (a few official pages), news headlines (a few feeds),
  # and tidying the change log. A few minutes in all.
  extras:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: robot-extras
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Staggered start (extras start 5 min in): 14 jobs opening at once overloaded the database on 10 Nov.
      - run: sleep $(( 300 ))
      - name: Scholarship rounds and deadlines
        continue-on-error: true
        run: npm run robot -- scholarships
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}
      - name: News links (adds new ones, removes expired and dead ones)
        continue-on-error: true
        run: npm run robot -- news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}
      - name: Tidy the change log
        continue-on-error: true
        run: npm run robot -- tidy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  official:
    if: github.event.schedule == '30 21 * * 0' || inputs.official == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - country: au
            scope: --all
          - country: us
            scope: ""
    concurrency:
      group: robot-official-${{ matrix.country }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Programs from the official course list
        run: npm run robot -- official ${{ matrix.country }} ${{ matrix.scope }} --parallel 10
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ROBOT_CONTACT_URL: ${{ vars.ROBOT_CONTACT_URL }}
